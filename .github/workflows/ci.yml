name: Continuous Integration

on:
  push:
    branches:
      - ecommerce-v2
  pull_request:
    branches:
      - ecommerce-v2

jobs:
  backend:
    name: Backend Tests & Validation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ecommerce_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ecommerce_test?schema=public

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Generate Prisma Client
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ecommerce_test?schema=public
        run: npx prisma generate

      - name: Validate Prisma Schema
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ecommerce_test?schema=public
        run: npx prisma validate

      - name: Push Schema to Test Database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ecommerce_test?schema=public
        run: npx prisma db push --skip-generate

      - name: Run Backend Test Suite
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ecommerce_test?schema=public
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ecommerce_test?schema=public
          JWT_SECRET: ci_test_jwt_secret_key_1234567890_min32chars
        run: npm test

  frontend:
    name: Frontend Build & Verification
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend production bundle
        run: npm run build

  docker:
    name: Docker Image Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        run: docker build -t ecommerce-backend:ci ./backend

      - name: Build frontend Docker image
        run: docker build -t ecommerce-frontend:ci ./frontend
